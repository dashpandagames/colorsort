<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Play Color Sort online — free colour sorting puzzle</title>
  <meta name="description" content="Play Color Sort free in your browser. Pour coloured water between bottles until every bottle holds one colour. 100 levels and a daily puzzle.">
  <meta name="theme-color" content="#fdf3ee">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <meta property="og:title" content="Play Color Sort online">
  <meta property="og:description" content="Pour, sort & relax — 100 levels and a daily puzzle, free in your browser.">
  <meta property="og:image" content="../assets/img/og-image.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="play-page">
  <div class="game">
    <header class="game-top">
      <a class="icon-btn" href="../" aria-label="Back to the Color Sort website">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </a>
      <div class="level-pill">
        <h1 id="level-title">Level 1</h1>
        <div id="level-stars" class="stars" aria-label="Stars for the current move count"></div>
      </div>
      <div class="moves-pill" title="Moves"><span class="label">Moves</span><span id="moves">0</span></div>
    </header>

    <p id="tip" class="tip" hidden></p>
    <canvas id="board" aria-label="Game board. Tap a bottle, then tap another bottle to pour."></canvas>

    <nav class="game-actions" aria-label="Game controls">
      <button id="btn-undo" class="act act-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 010 12h-3" /></svg>Undo</button>
      <button id="btn-restart" class="act act-restart" title="Restart (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9" /><path d="M3 4v5h5" /></svg>Restart</button>
      <button id="btn-hint" class="act act-hint" title="Hint (H)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z" /></svg>Hint</button>
      <button id="btn-levels" class="act act-levels" title="Levels">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2" /><rect x="14" y="3" width="7" height="7" rx="2" /><rect x="3" y="14" width="7" height="7" rx="2" /><rect x="14" y="14" width="7" height="7" rx="2" /></svg>Levels</button>
    </nav>
  </div>

  <dialog id="levels-dialog" class="sheet">
    <div class="sheet-head">
      <h2>Levels <small id="total-stars"></small></h2>
      <button id="levels-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="sheet-row">
      <button id="btn-daily" class="chip chip-yellow">Daily puzzle</button>
      <button id="btn-sound" class="chip">Sound: on</button>
    </div>
    <div id="level-grid" class="level-grid"></div>
    <p class="sheet-foot">Progress is saved in this browser. <button id="reset-progress" class="link">Reset progress</button></p>
  </dialog>

  <dialog id="win-dialog" class="card-dialog">
    <h2 id="win-title">Level complete!</h2>
    <div id="win-stars" class="stars big"></div>
    <p id="win-text"></p>
    <div class="dialog-buttons">
      <button id="win-next" class="btn btn-green">Next level ▶</button>
      <button id="win-replay" class="btn">Replay</button>
      <button id="win-levels" class="btn btn-pink">Levels</button>
    </div>
    <a class="get-app" href="https://play.google.com/store/apps/details?id=com.dashpandagames.colorsort" target="_blank" rel="noopener">Get the Android app: challenges, themes &amp; more →</a>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../js/levels.js"></script>
  <script src="../js/game.js"></script>
</body>
</html>
